server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true
      enabled: true

spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 100